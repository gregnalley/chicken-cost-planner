<!DOCTYPE html>

<html>

<head>

<title>
Chicken Farm Empire Test
</title>

</head>


<body>


<h1>
🐔 Chicken Farm Empire
</h1>


<div id="game-display">

Loading farm...

</div>




<script src="../scripts/chicken-game-namespace.js"></script>

<script src="../assets/data/chicken-game-config.js"></script>

<script src="../assets/data/chicken-game-state.js"></script>

<script src="../scripts/chicken-game-economy.js"></script>

<script src="../scripts/chicken-game-engine.js"></script>

<script src="../scripts/chicken-game-ui.js"></script>


<script>

BCPChickenGame.engine.start();

</script>

<script>


setInterval(function(){


const state =
  BCPChickenGame.engine.state;


document.getElementById(
  "game-display"
)
.innerHTML =

`

<h2>
Farm Status
</h2>

<p>
Day:
${state.time.day}
</p>

<p>
Time:
${String(state.time.minute).padStart(2,"0")}
</p>


<p>
🐔 Chickens:
${state.chickens.length}
</p>


<p>
🥚 Eggs:
${state.eggs}
</p>


<p>
💰 Money:
$${state.money}
</p>

`;



},1000);



</script>


</body>

</html>
